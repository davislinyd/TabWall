<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabWall</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101110;
        --panel: #1a1d1b;
        --border: #343a36;
        --text: #f1f0eb;
        --muted: #a5aaa4;
        --accent: #c97858;
        --accent-text: #fff8f3;
        --hover: #252b27;
        --disabled: #777d77;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f5f1ea;
          --panel: #fffdf9;
          --border: #d8d0c5;
          --text: #2e2b27;
          --muted: #77716a;
          --accent: #a95f43;
          --accent-text: #fffaf6;
          --hover: #f0e9df;
          --disabled: #aaa39a;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
      }

      main {
        display: grid;
        gap: 12px;
      }

      header {
        display: grid;
        gap: 3px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.01em;
      }

      .subtitle,
      .hint,
      #status {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .actions {
        display: grid;
        gap: 7px;
      }

      button {
        appearance: none;
        width: 100%;
        min-height: 36px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        text-align: left;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      button:hover:not(:disabled),
      button:focus-visible {
        background: var(--hover);
        border-color: var(--accent);
        outline: none;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        text-align: center;
      }

      button:disabled {
        color: var(--disabled);
        cursor: not-allowed;
        opacity: 0.72;
      }

      .divider {
        height: 1px;
        background: var(--border);
      }

      .annotate {
        display: grid;
        gap: 8px;
      }

      .annotate label,
      .toggle {
        font-size: 11px;
        color: var(--muted);
      }

      textarea,
      .tag-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      textarea {
        min-height: 64px;
        resize: vertical;
        padding: 8px;
      }

      .tag-input {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
        min-height: 36px;
        align-items: center;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--hover);
        font-size: 11px;
      }

      .chip button {
        width: auto;
        min-height: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }

      .tag-input input {
        flex: 1;
        min-width: 72px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        outline: none;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #status {
        min-height: 16px;
      }

      #status[data-state="error"] { color: #dc8a76; }
      #status[data-state="busy"] { color: var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main aria-labelledby="popupTitle">
      <header>
        <h1 id="popupTitle">TabWall</h1>
        <p class="subtitle" data-i18n="subtitle">選擇目前分頁的操作</p>
      </header>

      <section class="annotate" aria-labelledby="annotateHeading">
        <strong id="annotateHeading" data-i18n="annotateHeading">此分頁標註</strong>
        <p class="hint" id="annotateSource" hidden></p>
        <label for="pageNote" data-i18n="noteLabel">備註</label>
        <textarea id="pageNote" data-i18n-placeholder="notePh" placeholder="加入備註…"></textarea>
        <label for="pageTagDraft" data-i18n="tagsLabel">Tags</label>
        <div class="tag-input" id="pageTagInput">
          <div class="chips" id="pageChips"></div>
          <input id="pageTagDraft" type="text" data-i18n-placeholder="tagPh" placeholder="tag" autocomplete="off" />
        </div>
        <label class="toggle">
          <input type="checkbox" id="overlayToggle" />
          <span data-i18n="overlayToggle">顯示繪圖圖層</span>
        </label>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="actions" aria-label="TabWall actions">
        <button type="button" id="saveTabKeep" data-i18n="saveTabKeep">儲存目前分頁（不關閉）</button>
        <button type="button" id="saveTabClose" data-i18n="saveTabClose">儲存目前分頁（關閉）</button>
        <button type="button" id="saveGroupKeep" data-group-action data-i18n="saveGroupKeep">儲存目前群組（不關閉）</button>
        <button type="button" id="saveGroupClose" data-group-action data-i18n="saveGroupClose">儲存目前群組（關閉）</button>
        <p class="hint" id="groupHint" role="status" data-i18n="groupHint" hidden>目前分頁不在 Tab Group 中</p>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" class="primary" id="openPark" data-i18n="openPark">打開 TabWall 面板</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
