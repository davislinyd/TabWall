<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabWall Search</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07080c; color: #eee8dc; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .qs-panel { height: 100%; display: flex; flex-direction: column; }
      input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid rgba(232,225,210,.12); background: transparent; color: inherit; padding: 14px 16px; font: inherit; outline: none; }
      .qs-list { display: grid; gap: 2px; overflow: auto; padding: 6px; }
      .qs-row { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; border-radius: 7px; background: transparent; color: inherit; padding: 8px 10px; cursor: pointer; }
      .qs-row.active, .qs-row:hover { background: rgba(232,225,210,.08); }
      .qs-row span { color: #a39c91; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="qs-panel">
      <input id="qsInput" type="search" placeholder="Search parked tabs…" autocomplete="off" spellcheck="false" />
      <div id="qsList" class="qs-list"></div>
    </div>
    <script src="quickSearch.js"></script>
  </body>
</html>
